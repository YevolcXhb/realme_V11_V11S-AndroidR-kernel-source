# The RTL8188EU USB adapter is an optional second radio. Its driver registers a
# netdev named wlan0 and, if it probes before the on-board MediaTek driver, it
# takes that name and mtkwifi-init then skips its own initialisation ("wlan0
# already exists"). Keep it unloaded at boot so the on-board radio always owns
# wlan0; load it explicitly (modprobe r8188eu) when the adapter is needed.
blacklist r8188eu
