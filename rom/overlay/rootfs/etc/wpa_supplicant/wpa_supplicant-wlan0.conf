# wpa_supplicant configuration for wlan0 (any Wi-Fi driver).
# Generated for the Windows hotspot "Slider"; edit the network block to change AP.
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
country=CN

network={
    ssid="Slider"
    psk="xhb200615"
    key_mgmt=WPA-PSK
    proto=RSN WPA
    pairwise=CCMP TKIP
    group=CCMP TKIP
    priority=10
}
