# Automatic package activity disabled on purpose.
#
# This is a hand-built Ubuntu on a MediaTek phone: the kernel lives in the boot
# partition image we flash, not in a package, so an apt update can never replace
# it. What an unattended upgrade could still do is pull a new version of some
# userspace package and break a service on a box that is only reachable over the
# network. Nothing here is exposed to the internet, so keep package state frozen
# and update deliberately instead:
#
#   apt-get update && apt-get upgrade     # run by hand when you want it
APT::Periodic::Enable "0";
APT::Periodic::Update-Package-Lists "0";
APT::Periodic::Download-Upgradeable-Packages "0";
APT::Periodic::Unattended-Upgrade "0";
APT::Periodic::AutocleanInterval "0";
