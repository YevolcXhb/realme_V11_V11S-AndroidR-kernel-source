name: Build kernel (realme V11 / RMX3121, MT6833)

# Target: realme V11 / V11S (oppo6833, MT6833), kernel 4.14.186 Android R.
# The repo ships no AOSP tree, so we bypass Android.mk / kenv.mk / build.config*
# (they all require prebuilts/ and device/mediatek/build from a full AOSP
# checkout) and drive `make` directly with a self-contained toolchain pair:
#   * clang r383902   (moto-common prebuilt, static, includes ld.lld)
#   * aarch64 binutils 4.9 (LineageOS prebuilt; also provides the
#     aarch64-linux-androidkernel-* symlinks that build.config.mtk.aarch64
#     expects for CROSS_COMPILE)
#
# Products: Image.gz-dtb (kernel + appended mediatek/mt6833.dtb), Image.gz,
# Image, vmlinux, System.map and the one dtb.
#
# NOT built: odmdtbo.img. The 7 overlay dts in arch/arm64/boot/dts/mediatek/
# (oppo6833*.dts) `#include <oppo6833*/cust.dtsi>`, and those files live in the
# AOSP device tree, not in this kernel repo, so they cannot compile here. They
# are also never referenced by any kernel Makefile rule (only Android.mk:80 and
# the defconfig's CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES). The dtbo
# partition therefore stays stock on the device.

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: Kernel defconfig name (without _defconfig)
        required: true
        default: oppo6833
        type: choice
        options:
          - oppo6833
          - oppo6833_debug
      server_profile:
        description: Server DVFS defaults, USB Ethernet profile, or native Ubuntu
        required: true
        default: server
        type: choice
        options:
          - server
          - stock
          - ubuntu
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'ci/**'
      - 'Makefile'
      - 'Kconfig'
      - 'arch/arm64/**'
      - 'kernel/**'
      - 'drivers/**'
      - 'include/**'
      - 'scripts/**'

permissions:
  # Publishing the kernel images as a Release needs tag/create permission.
  # artifact storage is quota-limited account-wide and keeps failing, so the
  # Release is the only reliable delivery path.
  contents: write

env:
  ARCH: arm64
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-androidkernel-
  # Only one file in this tree consults TARGET_PRODUCT:
  # drivers/input/oppo_secure_common/oppo_secure_common/Makefile. It keys
  # CONFIG_OPPO_BSP_SECCOM_PLATFORM off it, and its final `else` branch is a
  # Qualcomm board, so oppo_secure_common.c ends up including <soc/qcom/smem.h>
  # (not in this tree) and the build dies. AOSP sets TARGET_PRODUCT globally;
  # driving make directly must supply it. The Makefile matches with
  # `findstring oppo6833`, which selects the MT6833 path:
  # -DCONFIG_OPPO_BSP_SECCOM_PLATFORM=6885 plus the masp asf_inc include dirs
  # that provide <sec_boot_lib.h>.
  TARGET_PRODUCT: full_oppo6833

jobs:
  build:
    name: Build ${{ github.event.inputs.defconfig || 'oppo6833' }} kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host packages
        # GitHub's runner mirror (azure.archive.ubuntu.com) has been failing DNS
        # for long stretches, which aborted builds here before any code was
        # compiled. Retrying the step is cheaper than teaching apt to switch
        # mirrors, and the install itself is idempotent.
        retry: 3
        run: |
          # GitHub's runner mirror (azure.archive.ubuntu.com) has been failing
          # DNS for stretches of time, which killed whole builds at this step
          # before any code compiled. Fall back to a reachable mirror when the
          # default one cannot be resolved, and retry the update once.
          for i in 1 2 3; do
            if sudo apt-get update; then break; fi
            if ! getent hosts azure.archive.ubuntu.com; then
              echo "runner mirror unresolvable; switching to archive.ubuntu.com"
              sudo sed -i -E 's#https?://[a-z.]*archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
                /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
              sudo rm -f /etc/apt/apt-mirrors.txt
            fi
            sleep 15
          done
          # libssl-dev: scripts/sign-file + extract-cert link against -lcrypto
          #   (defconfig has CONFIG_MODULE_SIG=y).
          # gcc-9: the shipped scripts/dtc/*.c_shipped define `yylloc` without
          #   `extern`; gcc-10+ (default -fno-common) makes that a duplicate
          #   symbol error. gcc-9 keeps -fcommon on.
          # bc/bison/flex/cpio: standard 4.14 build deps.
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio libssl-dev gcc-9 g++-9

      - name: Cache toolchains
        id: tc
        uses: actions/cache@v4
        with:
          path: toolchains
          key: kernel-toolchains-clang-r383902-binutils-4.9-v1

      - name: Fetch toolchains
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p toolchains
          git clone --depth 1 -b master \
            https://github.com/moto-common/platform_prebuilts_clang_host_linux-x86_clang-r383902 \
            toolchains/clang-r383902
          git clone --depth 1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            toolchains/gcc-aarch64-linux-android-4.9

      - name: Verify toolchain layout
        run: |
          set -euo pipefail
          CLANG_BIN="$PWD/toolchains/clang-r383902/bin"
          GCC_BIN="$PWD/toolchains/gcc-aarch64-linux-android-4.9/bin"
          for f in "$CLANG_BIN/clang" "$CLANG_BIN/ld.lld" "$CLANG_BIN/llvm-nm" "$CLANG_BIN/llvm-objcopy"; do
            test -x "$f" || { echo "missing $f"; exit 1; }
          done
          # Makefile:503 derives GCC_TOOLCHAIN_DIR from `which $(CROSS_COMPILE)elfedit`.
          test -x "$GCC_BIN/${CROSS_COMPILE}elfedit" || { echo "missing ${CROSS_COMPILE}elfedit"; exit 1; }
          test -x "$GCC_BIN/${CROSS_COMPILE}as" || { echo "missing ${CROSS_COMPILE}as (needed: -no-integrated-as)"; exit 1; }
          echo "toolchains ok"

      # CONFIG_WLAN_DRV_BUILD_IN builds the MediaTek Wi-Fi stack into vmlinux
      # instead of loading Android's CRC-bound .ko files. Two trees have to be
      # in place before make starts:
      #
      #  * the vendor Makefiles reach their siblings through
      #    $(srctree)/../vendor/mediatek/kernel_modules (the AOSP layout); this
      #    repo keeps the same sources under <repo>/kernel_modules.
      #  * drivers/misc/mediatek/connectivity/Makefile recurses into wmt_drv/,
      #    wmt_chrdev_wifi/ and wlan_drv_gen4m/, each of which needs to exist
      #    with a one-line Makefile that names the single object the vendor
      #    build produces. Parent directories of symlinks are not followed, so
      #    that Makefile is written next to the link rather than into the
      #    vendor tree.
      - name: Stage vendor connectivity sources
        run: |
          set -euo pipefail
          mkdir -p "$PWD/../vendor/mediatek"
          ln -sfn "$PWD/kernel_modules" "$PWD/../vendor/mediatek/kernel_modules"
          test -r "$PWD/../vendor/mediatek/kernel_modules/connectivity/common/common_main/include/wmt_exp.h"
          test -d "$PWD/../vendor/mediatek/kernel_modules/connectivity/wlan/core/gen4m"
          echo "vendor connectivity tree staged"

          CONN=drivers/misc/mediatek/connectivity
          VENDOR=$PWD/kernel_modules/connectivity
          rm -rf "$CONN/wmt_drv" "$CONN/wmt_chrdev_wifi" "$CONN/wlan_drv_gen4m"
          ln -s "$VENDOR/common"        "$CONN/wmt_drv"
          ln -s "$VENDOR/wlan/adaptor"  "$CONN/wmt_chrdev_wifi"
          ln -s "$VENDOR/wlan/core/gen4m" "$CONN/wlan_drv_gen4m"
          # The references belong to the directory being built: this Makefile is
          # parsed in "parse-obj" mode (drivers/Makefile recurses with
          # need-builtin=0), where kbuild reads obj-y but leaves it to the
          # separate "build-by-dir" pass to emit the rules -- and that pass runs
          # in ordinary mode from inside the directory. So the stub Makefiles
          # have to define obj-y themselves; a hand-written built-in.o rule does
          # not survive into that pass. The link beside each stub is what
          # supplies the sources, so the stub itself only names the object.
          stub() {
            dir="$1"; obj="$2"
            echo "obj-y += $obj" > "$CONN/$dir/Makefile"
          }
          stub wmt_drv          wmt_drv.o
          stub wmt_chrdev_wifi  wmt_chrdev_wifi.o
          stub wlan_drv_gen4m   wlan_drv_gen4m.o
          ls -la "$CONN"/wmt_drv "$CONN"/wmt_chrdev_wifi "$CONN"/wlan_drv_gen4m
          echo "wlan stub directories staged"

      - name: Build
        run: |
          set -euo pipefail
          TOOLS="$PWD/toolchains"
          export PATH="$TOOLS/clang-r383902/bin:$TOOLS/gcc-aarch64-linux-android-4.9/bin:$PATH"
          # ld.lld is not the fully static binary clang is; give it its LLVM libs.
          export LD_LIBRARY_PATH="$TOOLS/clang-r383902/lib64:${LD_LIBRARY_PATH:-}"

          # Some Oplus headers reach across the tree by the AOSP directory name of
          # this kernel, e.g. drivers/power/oplus/charger_ic/oplus_battery_mtk6853R.h
          # and ..._mtk6853R/6873R/6885R/6889R.h include
          #   "../../../../kernel-4.14/drivers/misc/mediatek/typec/tcpc/inc/tcpm.h"
          # From this file's directory that lands on <repo>/kernel-4.14/drivers/..,
          # which only exists when the kernel checkout is reachable as kernel-4.14.
          # Reproduce that layout instead of editing vendor sources.
          test -e kernel-4.14 || ln -s . kernel-4.14
          test -r kernel-4.14/drivers/misc/mediatek/typec/tcpc/inc/tcpm.h
          echo "kernel-4.14 shim ok"

          DEFCONFIG="${{ github.event.inputs.defconfig || 'oppo6833' }}"
          mkargs=(
            O=out ARCH=arm64
            CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy
            CLANG_TRIPLE="$CLANG_TRIPLE"
            CROSS_COMPILE="$CROSS_COMPILE"
            HOSTCC=gcc-9 HOSTCXX=g++-9
          )

          echo "== toolchain versions =="
          clang --version | head -2
          ld.lld --version
          ${CROSS_COMPILE}as --version | head -1
          gcc-9 --version | head -1

          echo "== defconfig: ${DEFCONFIG} =="
          make -j"$(nproc)" "${mkargs[@]}" "${DEFCONFIG}_defconfig" 2>&1 | tee build.log

          PROFILE="${{ github.event.inputs.server_profile || 'server' }}"
          if [ "$PROFILE" = server ]; then
            ./scripts/kconfig/merge_config.sh -m -O out out/.config ci/server.config
            make -j"$(nproc)" "${mkargs[@]}" olddefconfig 2>&1 | tee -a build.log
            python3 ci/check-server-config.py out/.config
          elif [ "$PROFILE" = ubuntu ]; then
            # Keep the server/USB-DVFS defaults and layer the native-Linux
            # requirements on top: devtmpfs, VT/console, the cgroup
            # controllers systemd insists on, autofs/fanotify/seccomp.
            # MODVERSIONS is irrelevant for this profile - Android is not
            # going to load the vendor modules - so no CRC gate afterwards.
            ./scripts/kconfig/merge_config.sh -m -O out out/.config ci/server.config
            ./scripts/kconfig/merge_config.sh -m -O out out/.config ci/ubuntu.config
            make -j"$(nproc)" "${mkargs[@]}" olddefconfig 2>&1 | tee -a build.log
            python3 ci/check-server-config.py out/.config
            python3 ci/check-ubuntu-config.py out/.config
          elif [ "$PROFILE" != stock ]; then
            echo "unsupported profile: $PROFILE" >&2
            exit 1
          fi
          python3 ci/test-server-policy.py

          echo "== build: Image.gz-dtb =="
          make -j"$(nproc)" "${mkargs[@]}" Image.gz-dtb 2>&1 | tee -a build.log

          echo "== products =="
          ls -la out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz-dtb
          ls -la out/arch/arm64/boot/dts/mediatek/*.dtb

      # r8188eu is the only driver in this tree that binds the bench adapter
      # (Realtek 0bda:8179, RTL8188EUS). Its Kconfig says "depends on m", so it
      # can never be built into vmlinux - but that is exactly what keeps the
      # ABI gate happy: a module carries its own CRCs read from the running
      # kernel at load time, it does not add or shift any exported symbol in
      # vmlinux, so the nine vendor modules under /vendor/lib/modules keep
      # loading. rtl8xxxu cannot be used here at all: dev_table[] has no
      # 0x8179 entry and there is no rtl8188e_fops.
      #
      # This step is NOT continue-on-error: if the module does not build the
      # release would be missing the only artifact that can drive this adapter.
      - name: Build kernel modules (r8188eu)
        run: |
          set -euo pipefail
          TOOLS="$PWD/toolchains"
          export PATH="$TOOLS/clang-r383902/bin:$TOOLS/gcc-aarch64-linux-android-4.9/bin:$PATH"
          export LD_LIBRARY_PATH="$TOOLS/clang-r383902/lib64:${LD_LIBRARY_PATH:-}"

          # KCONFIG_CONFIG is left at the default so this reuses the out/.config
          # that the step above already resolved (defconfig + optional
          # ci/server.config), instead of re-deriving it.
          #
          # The OEM defconfig also carries five unrelated =m options
          # (IKHEADERS, TCP_CONG_WESTWOOD, TCP_CONG_HTCP, BRIDGE_NETFILTER,
          # LCD_CLASS_DEVICE). They are not part of this change and a failure
          # in any of them must not cost us r8188eu.ko, so fall back to
          # building just the one directory when the whole-tree call fails.
          if ! make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCC=gcc-9 HOSTCXX=g++-9 \
            modules 2>&1 | tee -a build.log; then
            echo "::warning::whole-tree 'make modules' failed, retrying only rtl8188eu"
            make -j"$(nproc)" O=out ARCH=arm64 \
              CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
              CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" \
              HOSTCC=gcc-9 HOSTCXX=g++-9 KBUILD_MODPOST_WARN=1 \
              M=drivers/staging/rtl8188eu modules 2>&1 | tee -a build.log
          fi

          echo "== r8188eu products =="
          ls -la out/drivers/staging/rtl8188eu/r8188eu.ko
          # Resolved config must still say =m; a silent downgrade to n (e.g. a
          # dependency dropped by merge_config.sh) would otherwise only show up
          # as a missing file much later.
          grep -q '^CONFIG_R8188EU=m$' out/.config
          # (No symbol-export assertion here: llvm-nm lists imported __ksymtab_
          # entries as undefined too, so grepping for that name cannot tell an
          # export from an import. The driver exports nothing - verified with
          # nm --defined-only - but the CRC gate is what actually guards this.)
          modinfo out/drivers/staging/rtl8188eu/r8188eu.ko | head -20 || true

      # Best effort on purpose: the WiFi driver is an out-of-tree module built
      # from kernel_modules/connectivity/wlan/core/gen4m, and a failure here
      # must not cost us the kernel image that the flash needs.
      - name: Build WiFi module (best effort)
        continue-on-error: true
        run: |
          set -uo pipefail
          TOOLS="$PWD/toolchains"
          export PATH="$TOOLS/clang-r383902/bin:$TOOLS/gcc-aarch64-linux-android-4.9/bin:$PATH"
          export LD_LIBRARY_PATH="$TOOLS/clang-r383902/lib64:${LD_LIBRARY_PATH:-}"

          # Mirrors what drivers/misc/mediatek/connectivity/Makefile exports for
          # CONSYS_6833: it matches neither the 6779/6873/6853 nor the 3967/6785
          # list, so WLAN_IP_SET falls through to 1 and MTK_COMBO_CHIP to CONNAC.
          # CONFIG_MTK_COMBO_WIFI_HIF is mandatory -- gen4m/Makefile hard-errors
          # with "Unsuppoted HIF=" when it is unset.
          export MTK_COMBO_CHIP=CONNAC
          export MTK_PLATFORM_ID=6833
          export WLAN_CHIP_ID=6833
          export WIFI_IP_SET=1
          export CONFIG_MTK_COMBO_WIFI_HIF=axi
          export MTK_ANDROID_WMT=y
          export MTK_ANDROID_EMI=y

          # gen4m/Makefile reaches its WMT and conninfra headers through
          # $(TOP)/vendor/mediatek/kernel_modules/connectivity, i.e. a sibling of
          # the kernel checkout, which is how an AOSP tree lays it out. This repo
          # keeps the same sources under <repo>/kernel_modules, so link that into
          # place rather than editing the vendor Makefile.
          mkdir -p "$PWD/../vendor/mediatek"
          ln -sfn "$PWD/kernel_modules" "$PWD/../vendor/mediatek/kernel_modules"
          test -r "$PWD/../vendor/mediatek/kernel_modules/connectivity/common/common_main/include/wmt_exp.h"

          # Only gen4m needs rebuilding: the device already loads the vendor
          # wmt_drv / wmt_chrdev_wifi / conninfra modules, and the single change
          # here lives in gen4m. The catch is that gen4m imports symbols those
          # modules export, so modpost cannot resolve them at build time and
          # refuses to emit the .ko:
          #   wmt_drv         -> mtk_wcn_wmt_*, mtk_wcn_consys_hw_*
          #   wmt_chrdev_wifi -> wifi_reset_*, update_driver_loaded_status,
          #                      register_set_p2p_mode_handler, get_low_latency_mode
          #   conninfra       -> connsys_log_*
          # Rebuilding the whole stack just to satisfy modpost is not worth it;
          # KBUILD_MODPOST_WARN downgrades those lookups to warnings, the .ko is
          # still emitted, and at insmod time the kernel resolves them against
          # the vendor modules that are already loaded.
          #
          # OPLUS_MT6833_POWERINFO_STANDBY keeps the vendor WMT source honest for
          # the builds that do need it: in mtk_wcn_consys_hw.c the brace closing
          # the sleep-counter for-loop sits inside that #ifdef, so without the
          # macro the loop never closes. Nothing in this tree defines it.
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" \
            HOSTCC=gcc-9 HOSTCXX=g++-9 \
            KCFLAGS="-DOPLUS_MT6833_POWERINFO_STANDBY" \
            KBUILD_MODPOST_WARN=1 \
            M="$PWD/kernel_modules/connectivity/wlan/core/gen4m" \
            modules 2>&1 | tee module.log

      - name: Report WiFi module
        if: always()
        run: |
          echo "== .ko files anywhere =="
          find . -name '*.ko' 2>/dev/null | sort || true
          echo "== gen4m build products =="
          find kernel_modules/connectivity/wlan -name '*.ko' -o -name '*.o' 2>/dev/null | head -5 || true

      - name: Upload WiFi module
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wifimod-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            kernel_modules/**/*.ko
            out/**/*.ko
            module.log

      - name: Check MODVERSIONS CRCs against baseline
        # The CRC gate exists to keep Android's prebuilt vendor modules loadable.
        # The ubuntu profile intentionally changes configs whose types sit on the
        # exported-symbol graph (CGROUP_DEVICE/CGROUP_PIDS resize struct cgroup,
        # DEVTMPFS/VT pull in new code), and Android is not going to load
        # /vendor/lib/modules on that boot anyway. Run the gate for every other
        # profile, skip it for ubuntu.
        if: ${{ (github.event.inputs.server_profile || 'server') != 'ubuntu' }}
        run: |
          set -euo pipefail
          # The vendor .ko under /vendor/lib/modules/ are built against the OEM
          # defconfig and carry MODVERSIONS CRCs for the symbols they import.
          # Any CONFIG change that alters an exported struct layout shifts those
          # CRCs and makes the vendor modules unloadable:
          #   wmt_drv: disagrees about version of symbol module_layout
          #   insmod: Exec format error
          # CONFIG_MODULE_SIG_FORCE=y + no CONFIG_MODULE_FORCE_LOAD means there is
          # no --force escape hatch, so this must fail loudly at build time.
          #
          # ci/modversions-baseline.txt is the known-good table extracted from the
          # Route A kernel (1920da440), which was verified byte-compatible with
          # the OEM CRCs for every one of the 11239 exported symbols.
          NM="${TOOLS:-$PWD/toolchains}/clang-r383902/bin/llvm-nm"
          [ -x "$NM" ] || NM=llvm-nm

          # Sort both sides with LC_ALL=C so the comparison is purely about the
          # CRC values, not about locale-dependent collation of symbol names.
          # Find the __crc_* field by name rather than by column index so this
          # cannot silently pass if nm's field order changes.
          # Emit the same "<name> <value>" shape as ci/modversions-baseline.txt.
          "$NM" out/vmlinux | awk '
            {
              name = ""; value = "";
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^__crc_/) { name = $i; sub(/^__crc_/, "", name) }
                else if (value == "" && $i ~ /^[0-9a-fA-F]+$/) value = $i
              }
              if (name != "") print name, value
            }' | LC_ALL=C sort > /tmp/crcs.txt
          LC_ALL=C sort ci/modversions-baseline.txt > /tmp/crcs-ref.txt

          n_cur=$(wc -l < /tmp/crcs.txt)
          n_ref=$(wc -l < /tmp/crcs-ref.txt)
          echo "symbols with CRC: built=$n_cur baseline=$n_ref"

          # Diagnose the raw shape before comparing, so a format mismatch can
          # never masquerade as a CRC regression.
          echo "== built sample =="
          head -3 /tmp/crcs.txt | cat -A | sed 's/\$$//'
          echo "== baseline sample =="
          head -3 /tmp/crcs-ref.txt | cat -A | sed 's/\$$//'
          echo "== built __alloc_skb / __check_sticky / ___pskb_trim =="
          grep -E '^(__alloc_skb|__check_sticky|___pskb_trim) ' /tmp/crcs.txt || true
          echo "== baseline same three =="
          grep -E '^(__alloc_skb|__check_sticky|___pskb_trim) ' /tmp/crcs-ref.txt || true

          # Compare by symbol NAME, never by the whole line: a symbol is only a
          # real regression when its name vanished or its CRC changed.
          LC_ALL=C join -j 1 -o 1.1,1.2,2.2 /tmp/crcs-ref.txt /tmp/crcs.txt > /tmp/crc.join
          LC_ALL=C join -v 1 -j 1 /tmp/crcs-ref.txt /tmp/crcs.txt > /tmp/crc.gone
          LC_ALL=C join -v 2 -j 1 /tmp/crcs-ref.txt /tmp/crcs.txt > /tmp/crc.new

          gone=$(wc -l < /tmp/crc.gone)
          new=$(wc -l < /tmp/crc.new)
          changed=$(awk '$2 != $3' /tmp/crc.join | wc -l)
          echo "gone=$gone new=$new crc_changed=$changed"
          {
            echo "### MODVERSIONS report"
            echo ""
            echo "| metric | count |"
            echo "|---|---|"
            echo "| symbols built | $n_cur |"
            echo "| symbols baseline | $n_ref |"
            echo "| disappeared | $gone |"
            echo "| newly exported | $new |"
            echo "| CRC changed | $changed |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$gone" -gt 0 ]; then
            echo "::error::$gone exported symbol(s) disappeared; vendor modules importing them cannot load."
            cat /tmp/crc.gone
            exit 1
          fi

          if [ "$changed" -gt 0 ]; then
            echo "::error::$changed exported symbol MODVERSIONS CRC(s) differ from the baseline."
            echo "::error::Vendor modules in /vendor/lib/modules/ will refuse to load (Exec format error)."
            awk '$2 != $3' /tmp/crc.join | sort -k1,1 > /tmp/crc.changed
            echo "== CRC changed (name baseline built) =="
            cat /tmp/crc.changed
            echo "== how many changed symbols per subsystem prefix =="
            awk -F' ' '{ n=split($1, p, "_"); print p[1]"_"p[2] }' /tmp/crc.changed \
              | sort | uniq -c | sort -rn | head -30
            {
              echo ""
              echo "#### CRC changed (name / baseline / built)"
              echo '```'
              cat /tmp/crc.changed
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "OK: all $n_cur exported CRCs match the vendor-compatible baseline (plus $new new export(s))."
          {
            echo ""
            echo "Newly exported symbols are additive only and cannot break a vendor .ko:"
            echo '```'
            cat /tmp/crc.new
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel images (artifact)
        if: success()
        continue-on-error: true
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.event.inputs.defconfig || 'oppo6833' }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/mediatek/*.dtb
            out/vmlinux
            out/System.map

      # Artifact upload is capped at the account-wide storage quota and that
      # quota is re-counted on a multi-hour cycle, so a deleted artifact does
      # not free space immediately and upload-artifact fails with
      # "Artifact storage quota has been hit".  The Release assets below have a
      # separate allowance and are the path that always produces a usable file.
      - name: Package kernel images
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          cp out/arch/arm64/boot/Image.gz-dtb dist/
          cp out/arch/arm64/boot/Image dist/
          cp out/System.map dist/
          # The RTL8188EU adapter (0bda:8179) is only reachable through this
          # module - "depends on m" means it is never part of Image.gz-dtb.
          # Ship it next to the kernel so the flash procedure does not have to
          # rebuild it separately.
          cp out/drivers/staging/rtl8188eu/r8188eu.ko dist/
          cp build.log dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist

      - name: Publish kernel images as a Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}-${{ github.event.inputs.defconfig || 'oppo6833' }}-${{ github.event.inputs.server_profile || 'server' }}
          name: realme V11 kernel ${{ github.event.inputs.defconfig || 'oppo6833' }} / ${{ github.event.inputs.server_profile || 'server' }} / ${{ github.sha }}
          body: |
            Automated build of `${{ github.sha }}` (${{ github.event.inputs.defconfig || 'oppo6833' }}_defconfig).

            Profile: `${{ github.event.inputs.server_profile || 'server' }}`.
            A passing build includes the exported-symbol CRC compatibility gate.
            This does not verify charging, Ethernet throughput, or runtime governor selection.

            Artifacts in this release:
            - `Image.gz-dtb` - kernel + appended MT6833 device tree, the file to repack into boot.img
            - `Image` - raw arm64 kernel
            - `r8188eu.ko` - Realtek RTL8188EU USB WiFi driver (0bda:8179 / 0bda:0179).
              Built as a module because the driver's Kconfig says `depends on m`;
              it is deliberately not part of the kernel image. Load it with
              `insmod` after the kernel is booted. It needs
              `rtlwifi/rtl8188eufw.bin` on the device (see below) and talks WEXT,
              so pair it with `wpa_supplicant -Dwext`.
            - `System.map` - symbol map for the exact build
            - `build.log` - full compile log
            - `SHA256SUMS.txt` - checksums

            r8188eu firmware is not bundled: push `rtlwifi/rtl8188eufw.bin` to
            `/data/misc/firmware/active/` or `/odm/firmware/`, both of which are in
            this kernel's `fw_path[]` table.
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: build.log
