name: Build kernel (realme V11 / RMX3121, MT6833)

# Target: realme V11 / V11S (oppo6833, MT6833), kernel 4.14.186 Android R.
# The repo ships no AOSP tree, so we bypass Android.mk / kenv.mk / build.config*
# (they all require prebuilts/ and device/mediatek/build from a full AOSP
# checkout) and drive `make` directly with a self-contained toolchain pair:
#   * clang r383902   (moto-common prebuilt, static, includes ld.lld)
#   * aarch64 binutils 4.9 (LineageOS prebuilt; also provides the
#     aarch64-linux-androidkernel-* symlinks that build.config.mtk.aarch64
#     expects for CROSS_COMPILE)
#
# Products: Image.gz-dtb (kernel + appended mediatek/mt6833.dtb), Image.gz,
# Image, vmlinux, System.map and the one dtb.
#
# NOT built: odmdtbo.img. The 7 overlay dts in arch/arm64/boot/dts/mediatek/
# (oppo6833*.dts) `#include <oppo6833*/cust.dtsi>`, and those files live in the
# AOSP device tree, not in this kernel repo, so they cannot compile here. They
# are also never referenced by any kernel Makefile rule (only Android.mk:80 and
# the defconfig's CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES). The dtbo
# partition therefore stays stock on the device.

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: Kernel defconfig name (without _defconfig)
        required: true
        default: oppo6833
        type: choice
        options:
          - oppo6833
          - oppo6833_debug
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'ci/**'
      - 'Makefile'
      - 'Kconfig'
      - 'arch/arm64/**'
      - 'kernel/**'
      - 'drivers/**'
      - 'include/**'
      - 'scripts/**'

permissions:
  contents: read

env:
  ARCH: arm64
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-androidkernel-
  # Only one file in this tree consults TARGET_PRODUCT:
  # drivers/input/oppo_secure_common/oppo_secure_common/Makefile. It keys
  # CONFIG_OPPO_BSP_SECCOM_PLATFORM off it, and its final `else` branch is a
  # Qualcomm board, so oppo_secure_common.c ends up including <soc/qcom/smem.h>
  # (not in this tree) and the build dies. AOSP sets TARGET_PRODUCT globally;
  # driving make directly must supply it. The Makefile matches with
  # `findstring oppo6833`, which selects the MT6833 path:
  # -DCONFIG_OPPO_BSP_SECCOM_PLATFORM=6885 plus the masp asf_inc include dirs
  # that provide <sec_boot_lib.h>.
  TARGET_PRODUCT: full_oppo6833

jobs:
  build:
    name: Build ${{ github.event.inputs.defconfig || 'oppo6833' }} kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host packages
        run: |
          sudo apt-get update
          # libssl-dev: scripts/sign-file + extract-cert link against -lcrypto
          #   (defconfig has CONFIG_MODULE_SIG=y).
          # gcc-9: the shipped scripts/dtc/*.c_shipped define `yylloc` without
          #   `extern`; gcc-10+ (default -fno-common) makes that a duplicate
          #   symbol error. gcc-9 keeps -fcommon on.
          # bc/bison/flex/cpio: standard 4.14 build deps.
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio libssl-dev gcc-9 g++-9

      - name: Cache toolchains
        id: tc
        uses: actions/cache@v4
        with:
          path: toolchains
          key: kernel-toolchains-clang-r383902-binutils-4.9-v1

      - name: Fetch toolchains
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p toolchains
          git clone --depth 1 -b master \
            https://github.com/moto-common/platform_prebuilts_clang_host_linux-x86_clang-r383902 \
            toolchains/clang-r383902
          git clone --depth 1 -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            toolchains/gcc-aarch64-linux-android-4.9

      - name: Verify toolchain layout
        run: |
          set -euo pipefail
          CLANG_BIN="$PWD/toolchains/clang-r383902/bin"
          GCC_BIN="$PWD/toolchains/gcc-aarch64-linux-android-4.9/bin"
          for f in "$CLANG_BIN/clang" "$CLANG_BIN/ld.lld" "$CLANG_BIN/llvm-nm" "$CLANG_BIN/llvm-objcopy"; do
            test -x "$f" || { echo "missing $f"; exit 1; }
          done
          # Makefile:503 derives GCC_TOOLCHAIN_DIR from `which $(CROSS_COMPILE)elfedit`.
          test -x "$GCC_BIN/${CROSS_COMPILE}elfedit" || { echo "missing ${CROSS_COMPILE}elfedit"; exit 1; }
          test -x "$GCC_BIN/${CROSS_COMPILE}as" || { echo "missing ${CROSS_COMPILE}as (needed: -no-integrated-as)"; exit 1; }
          echo "toolchains ok"

      - name: Build
        run: |
          set -euo pipefail
          TOOLS="$PWD/toolchains"
          export PATH="$TOOLS/clang-r383902/bin:$TOOLS/gcc-aarch64-linux-android-4.9/bin:$PATH"
          # ld.lld is not the fully static binary clang is; give it its LLVM libs.
          export LD_LIBRARY_PATH="$TOOLS/clang-r383902/lib64:${LD_LIBRARY_PATH:-}"

          # Some Oplus headers reach across the tree by the AOSP directory name of
          # this kernel, e.g. drivers/power/oplus/charger_ic/oplus_battery_mtk6853R.h
          # and ..._mtk6853R/6873R/6885R/6889R.h include
          #   "../../../../kernel-4.14/drivers/misc/mediatek/typec/tcpc/inc/tcpm.h"
          # From this file's directory that lands on <repo>/kernel-4.14/drivers/..,
          # which only exists when the kernel checkout is reachable as kernel-4.14.
          # Reproduce that layout instead of editing vendor sources.
          test -e kernel-4.14 || ln -s . kernel-4.14
          test -r kernel-4.14/drivers/misc/mediatek/typec/tcpc/inc/tcpm.h
          echo "kernel-4.14 shim ok"

          DEFCONFIG="${{ github.event.inputs.defconfig || 'oppo6833' }}"
          mkargs=(
            O=out ARCH=arm64
            CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy
            CLANG_TRIPLE="$CLANG_TRIPLE"
            CROSS_COMPILE="$CROSS_COMPILE"
            HOSTCC=gcc-9 HOSTCXX=g++-9
          )

          echo "== toolchain versions =="
          clang --version | head -2
          ld.lld --version
          ${CROSS_COMPILE}as --version | head -1
          gcc-9 --version | head -1

          echo "== defconfig: ${DEFCONFIG} =="
          make -j"$(nproc)" "${mkargs[@]}" "${DEFCONFIG}_defconfig" 2>&1 | tee build.log

          echo "== build: Image.gz-dtb =="
          make -j"$(nproc)" "${mkargs[@]}" Image.gz-dtb 2>&1 | tee -a build.log

          echo "== products =="
          ls -la out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz-dtb
          ls -la out/arch/arm64/boot/dts/mediatek/*.dtb

      - name: Check MODVERSIONS CRCs against baseline
        run: |
          set -euo pipefail
          # The vendor .ko under /vendor/lib/modules/ are built against the OEM
          # defconfig and carry MODVERSIONS CRCs for the symbols they import.
          # Any CONFIG change that alters an exported struct layout shifts those
          # CRCs and makes the vendor modules unloadable:
          #   wmt_drv: disagrees about version of symbol module_layout
          #   insmod: Exec format error
          # CONFIG_MODULE_SIG_FORCE=y + no CONFIG_MODULE_FORCE_LOAD means there is
          # no --force escape hatch, so this must fail loudly at build time.
          #
          # ci/modversions-baseline.txt is the known-good table extracted from the
          # Route A kernel (1920da440), which was verified byte-compatible with
          # the OEM CRCs for every one of the 11239 exported symbols.
          NM="${TOOLS:-$PWD/toolchains}/clang-r383902/bin/llvm-nm"
          [ -x "$NM" ] || NM=llvm-nm

          # Sort both sides with LC_ALL=C so the comparison is purely about the
          # CRC values, not about locale-dependent collation of symbol names.
          # Find the __crc_* field by name rather than by column index so this
          # cannot silently pass if nm's field order changes.
          # Emit the same "<name> <value>" shape as ci/modversions-baseline.txt.
          "$NM" out/vmlinux | awk '
            {
              name = ""; value = "";
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^__crc_/) { name = $i; sub(/^__crc_/, "", name) }
                else if (value == "" && $i ~ /^[0-9a-fA-F]+$/) value = $i
              }
              if (name != "") print name, value
            }' | LC_ALL=C sort > /tmp/crcs.txt
          LC_ALL=C sort ci/modversions-baseline.txt > /tmp/crcs-ref.txt

          n_cur=$(wc -l < /tmp/crcs.txt)
          n_ref=$(wc -l < /tmp/crcs-ref.txt)
          echo "symbols with CRC: built=$n_cur baseline=$n_ref"

          # A missing/renamed symbol is as dangerous as a changed one, so compare
          # the line counts as well as the tables themselves.
          if [ "$n_cur" != "$n_ref" ]; then
            echo "::error::exported symbol count changed: built=$n_cur baseline=$n_ref"
            diff -u /tmp/crcs-ref.txt /tmp/crcs.txt | head -40 || true
            exit 1
          fi

          if ! diff -u /tmp/crcs-ref.txt /tmp/crcs.txt > /tmp/crc.diff; then
            changed=$(grep -c '^-[^-]' /tmp/crc.diff || true)
            echo "::error::$changed exported symbol MODVERSIONS CRC(s) differ from the baseline."
            echo "::error::Vendor modules in /vendor/lib/modules/ will refuse to load (Exec format error)."
            echo "::error::A CONFIG in this change altered an exported struct layout. Revert it, or rebuild the vendor .ko too."
            echo "== first 40 differences (baseline '-', built '+') =="
            head -40 /tmp/crc.diff
            exit 1
          fi

          echo "OK: all $n_cur exported CRCs match the vendor-compatible baseline."

      - name: Upload kernel images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.event.inputs.defconfig || 'oppo6833' }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dts/mediatek/*.dtb
            out/vmlinux
            out/System.map

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: build.log
