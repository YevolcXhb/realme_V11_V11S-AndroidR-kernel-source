name: Build MediaTek WiFi modules (quick)

# Fast iteration for the vendor Wi-Fi modules: this job only prepares the kernel
# (defconfig + modules_prepare) instead of building the whole image, so a change
# to the vendor Makefiles can be validated in minutes.
#
# Modules are built with the exact .config the Ubuntu kernel profile uses, so
# their MODVERSIONS CRCs match that kernel.

on:
  workflow_dispatch:
    inputs:
      server_profile:
        description: Profile whose .config to build against
        required: true
        default: ubuntu
        type: choice
        options:
          - ubuntu
          - server

permissions:
  contents: write

env:
  ARCH: arm64
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-androidkernel-
  TARGET_PRODUCT: full_oppo6833

jobs:
  modules:
    name: WiFi modules (${{ github.event.inputs.server_profile }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host packages
        run: |
          set -uo pipefail
          sudo apt-get update || true
          if sudo -E apt-get install -y --no-install-recommends bc bison flex cpio libssl-dev gcc-9 g++-9; then
            exit 0
          fi
          echo "::warning::mirror unusable; installing pre-fetched debs"
          curl -fL --retry 10 --retry-delay 3 --retry-all-errors --connect-timeout 20 \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            -o /tmp/hostdeps.tar.gz \
            https://api.github.com/repos/${{ github.repository }}/releases/assets/736113572
          mkdir -p /tmp/hostdeps
          tar -xzf /tmp/hostdeps.tar.gz -C /tmp/hostdeps
          sudo dpkg -i /tmp/hostdeps/*.deb || sudo dpkg -i /tmp/hostdeps/*.deb

      - name: Cache toolchains
        id: tc
        uses: actions/cache@v4
        with:
          path: toolchains
          key: kernel-toolchains-clang-r383902-binutils-4.9-v1

      - name: Fetch toolchains
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p toolchains
          git clone --depth 1 -b master https://github.com/moto-common/platform_prebuilts_clang_host_linux-x86_clang-r383902 toolchains/clang-r383902
          git clone --depth 1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchains/gcc-aarch64-linux-android-4.9

      - name: Prepare kernel tree
        run: |
          set -euo pipefail
          TOOLS="$PWD/toolchains"
          export PATH="$TOOLS/clang-r383902/bin:$TOOLS/gcc-aarch64-linux-android-4.9/bin:$PATH"
          export LD_LIBRARY_PATH="$TOOLS/clang-r383902/lib64:${LD_LIBRARY_PATH:-}"
          test -e kernel-4.14 || ln -s . kernel-4.14
          mkdir -p "$PWD/../vendor/mediatek"
          ln -sfn "$PWD/kernel_modules" "$PWD/../vendor/mediatek/kernel_modules"
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" HOSTCC=gcc-9 HOSTCXX=g++-9 \
            oppo6833_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config ci/server.config
          if [ "${{ github.event.inputs.server_profile }}" = ubuntu ]; then
            ./scripts/kconfig/merge_config.sh -m -O out out/.config ci/ubuntu.config
          fi
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" HOSTCC=gcc-9 HOSTCXX=g++-9 \
            olddefconfig
          grep -E "^CONFIG_(MTK_COMBO|MTK_COMBO_WIFI|WLAN_DRV_BUILD_IN|MTK_WIFI_ONLY)=" out/.config || true
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" HOSTCC=gcc-9 HOSTCXX=g++-9 \
            modules_prepare

      - name: Build vendor Wi-Fi modules
        run: |
          set -uo pipefail
          TOOLS="$PWD/toolchains"
          export PATH="$TOOLS/clang-r383902/bin:$TOOLS/gcc-aarch64-linux-android-4.9/bin:$PATH"
          export LD_LIBRARY_PATH="$TOOLS/clang-r383902/lib64:${LD_LIBRARY_PATH:-}"
          # CONSYS_6833 is a CONNAC2X2 SOC3_0 part: the DT node is 18000000.wifi, AXI HIF,
          # and conninfra is built into the kernel. Building the adaptor as plain
          # CONNAC leaves CFG_ANDORID_CONNINFRA_SUPPORT=0, so power-on goes through the
          # legacy wmt_lib queues that the conninfra stack never starts ("Queue is NULL,
          # name: wmtd_thread" -> "WMT turn on WIFI fail").
          export MTK_COMBO_CHIP=CONNAC MTK_PLATFORM_ID=6833 WLAN_CHIP_ID=6833 WIFI_IP_SET=1
          export CONFIG_MTK_COMBO_WIFI_HIF=axi MTK_ANDROID_WMT=y MTK_ANDROID_EMI=y ADAPTOR_OPTS=CONNAC
          export MTK_WIFI_AS_MODULE=1
          FORCE="CONFIG_MTK_COMBO=m CONFIG_MTK_COMBO_WIFI=m CONFIG_WLAN_DRV_BUILD_IN=n CONFIG_MTK_WIFI_ONLY=n CONFIG_MTK_WIFI_CONNINFRA_SUPPORT=n"
          mk() {
            echo "==== $1 ===="
            make -j"$(nproc)" O=out ARCH=arm64 CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
              CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" HOSTCC=gcc-9 HOSTCXX=g++-9 \
              KCFLAGS="-DOPLUS_MT6833_POWERINFO_STANDBY" KBUILD_MODPOST_WARN=1 $FORCE \
              M="$2" modules 2>&1 | tee "$3"
            echo "---- $1 tail ----"
            grep -E "MODPOST|LD \[M\]|CC \[M\]|error" "$3" | tail -8 || true
          }
          # On CONNAC2X2 SOC3_0 the adaptor talks to the conninfra that is already built
          # into this kernel (mtk_wcn_conninfra_* in System.map); there is no wmt_drv
          # module in this configuration and no conninfra.ko to load - the vendor
          # conninfra tree has no platform/mt6833 to build against anyway.
          # wmt_drv needs the SOC chip name so common/Makefile adds -DMTK_WCN_SOC_CHIP_SUPPORT
          # (without it the chip is never powered and wmt_lib has no queues); the
          # other two modules stay on CONNAC, which is how the ROM builds them.
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            CLANG_TRIPLE="$CLANG_TRIPLE" CROSS_COMPILE="$CROSS_COMPILE" HOSTCC=gcc-9 HOSTCXX=g++-9 \
            KCFLAGS="-DOPLUS_MT6833_POWERINFO_STANDBY" KBUILD_MODPOST_WARN=1 $FORCE \
            CONFIG_MTK_COMBO_CHIP="CONSYS_6833" \
            M="$PWD/kernel_modules/connectivity/common" modules 2>&1 | tee mtk_wmt.log
          grep -E "MODPOST|LD \[M\]" mtk_wmt.log | tail -3 || true
          mk wmt_chrdev_wifi "$PWD/kernel_modules/connectivity/wlan/adaptor" mtk_chr.log
          mk wlan_drv_gen4m "$PWD/kernel_modules/connectivity/wlan/core/gen4m" mtk_wlan.log
          echo "== .ko files =="
          find kernel_modules -name '*.ko' | sort | tee mtk_modules.txt
          while read -r f; do modinfo "$f" | grep -E "^(filename|vermagic|depends|name):" || true; done < mtk_modules.txt

      - name: Upload modules
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mtkwifi-quick-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            kernel_modules/**/*.ko
            mtk_*.log
            mtk_modules.txt
